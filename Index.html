<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOE | Sentinels of Europe</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .shield {
            border: 3px solid #b87333;
            border-top: 5px solid #b87333;
            padding: 30px 50px;
            border-radius: 15px 15px 50px 50px;
            background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 100%);
            box-shadow: 0 0 20px rgba(184, 115, 51, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            color: #b87333;
            letter-spacing: 6px;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
        }
        .tagline {
            font-size: 1rem;
            color: #a0a0a0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .lambda {
            font-size: 3.5rem;
            color: #b87333;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(184, 115, 51, 0.5);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .player-card {
            background-color: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
        }
        .player-card:hover {
            border-color: #b87333;
            box-shadow: 0 0 10px rgba(184, 115, 51, 0.3);
            color: #b87333;
        }
        .icon-plus {
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="shield">
        <div class="lambda">&Lambda;</div>
        <h1>SENTINELS OF EUROPE</h1>
        <p class="tagline">Tactical Gaming Clan</p>
    </div>

    <div class="cards-grid">
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
        <div class="player-card"><div class="icon-plus">+</div><span>SPIELERKARTE</span></div>
    </div>
</body>
</html>
